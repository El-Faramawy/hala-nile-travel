<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d070"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <linearGradient id="italyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009246"/>
      <stop offset="100%" stop-color="#006633"/>
    </linearGradient>
    <linearGradient id="italyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ce2b37"/>
      <stop offset="100%" stop-color="#991b24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Emblem (Left / Right depending on RTL, centered in 100x100) -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Shield / Seal -->
    <path d="M 50,5 L 88,20 C 88,60 50,92 50,95 C 50,92 12,60 12,20 Z" fill="#0b1b33" stroke="url(#goldGrad)" stroke-width="2.5"/>
    
    <!-- Italian flag micro-ribbon arc -->
    <path d="M 28,32 Q 50,22 72,32" fill="none" stroke="url(#italyGreen)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 32,38 Q 50,28 68,38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 36,44 Q 50,34 64,44" fill="none" stroke="url(#italyRed)" stroke-width="3" stroke-linecap="round"/>

    <!-- Flying Wing / Compass / Globe Star in Gold -->
    <path d="M 50,38 L 54,49 L 66,50 L 57,58 L 60,70 L 50,63 L 40,70 L 43,58 L 34,50 L 46,49 Z" fill="url(#goldGrad)"/>
    
    <!-- Laurel Leaf branch accents -->
    <path d="M 24,65 C 20,55 24,42 27,38" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 76,65 C 80,55 76,42 73,38" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: هلا النيل (Arabic Display) -->
  <g transform="translate(125, 20)">
    <text x="0" y="44" font-family="'Cairo', 'Tajawal', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="42" fill="#0f2b48" letter-spacing="-0.5">
      هلا النيل
    </text>
    
    <!-- Italian & English Subtitle -->
    <text x="2" y="70" font-family="'Cairo', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="15.5" fill="#008c45">
      لإلحاق العمالة المصرية بالخارج
    </text>
    
    <text x="3" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#718096" letter-spacing="1.5">
      HALA AL-NILE • ITALY RECRUITMENT AGENCY
    </text>
  </g>

  <!-- Official Badge on side -->
  <g transform="translate(435, 30)">
    <rect x="0" y="0" width="95" height="42" rx="6" fill="#f0f7f3" stroke="#008c45" stroke-width="1"/>
    <text x="47" y="18" font-family="'Cairo', sans-serif" font-size="10.5" font-weight="700" fill="#008c45" text-anchor="middle">ترخيص قوى عاملة</text>
    <text x="47" y="33" font-family="'Cairo', sans-serif" font-size="11.5" font-weight="900" fill="#0b1b33" text-anchor="middle">رقم 912 شركات</text>
  </g>
</svg>

