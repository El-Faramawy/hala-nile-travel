<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 95" width="100%" height="100%">
  <defs>
    <linearGradient id="hdrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d070"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <linearGradient id="hdrGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009246"/>
      <stop offset="100%" stop-color="#006633"/>
    </linearGradient>
    <linearGradient id="hdrRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ce2b37"/>
      <stop offset="100%" stop-color="#991b24"/>
    </linearGradient>
    <filter id="hdrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Luxury Shield Emblem -->
  <g transform="translate(6, 6)" filter="url(#hdrGlow)">
    <!-- Outer Shield -->
    <path d="M 42,4 L 75,17 C 75,52 42,78 42,80 C 42,78 9,52 9,17 Z" fill="#0b1b33" stroke="url(#hdrGold)" stroke-width="2.5"/>
    
    <!-- Italian flag arcs -->
    <path d="M 23,28 Q 42,19 61,28" fill="none" stroke="url(#hdrGreen)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 26,34 Q 42,25 58,34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 29,40 Q 42,31 55,40" fill="none" stroke="url(#hdrRed)" stroke-width="3" stroke-linecap="round"/>

    <!-- Gold Wing / Compass Star -->
    <path d="M 42,34 L 45,43 L 55,44 L 47,51 L 50,61 L 42,55 L 34,61 L 37,51 L 29,44 L 39,43 Z" fill="url(#hdrGold)"/>
  </g>

  <!-- Typography: هلا النيل (Large, Crisp & Authoritative) -->
  <g transform="translate(98, 12)">
    <!-- Brand Title -->
    <text x="0" y="38" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="36" fill="#0f2b48" letter-spacing="-0.5">
      هلا النيل
    </text>
    
    <!-- Subtitle: Strictly "لإلحاق العمالة بالخارج" without "والخدمات السياحية" -->
    <text x="2" y="58" font-family="'Cairo', sans-serif" font-weight="700" font-size="13" fill="#008c45">
      لإلحاق العمالة المصرية بالخارج
    </text>
    
    <!-- Latin Brand & Specialization Tag -->
    <text x="3" y="73" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9.5" fill="#64748b" letter-spacing="1.2">
      HALA AL-NILE • ITALY RECRUITMENT
    </text>
  </g>
</svg>

